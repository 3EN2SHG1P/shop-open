<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的优惠券 - 随心商城</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cp-page { padding: 20px 0 40px; min-height: 500px; }
    .cp-tabs { background-color: var(--bg-white); display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; border-radius: 4px 4px 0 0; flex-wrap: wrap; }
    .cp-tab { padding: 14px 26px; font-size: 14px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .cp-tab:hover { color: var(--primary); }
    .cp-tab.active { color: var(--primary); font-weight: 700; border-bottom-color: var(--primary); }
    .cp-get-entry { margin-left: auto; font-size: 13px; color: var(--primary); cursor: pointer; padding: 6px 14px; }
    .cp-grid { display: flex; flex-wrap: wrap; gap: 14px; }
    .cp-card { width: 300px; background-color: var(--bg-white); border-radius: 6px; display: flex; overflow: hidden; position: relative; border: 1px solid var(--border-light); }
    .cp-card .cp-left { width: 110px; background-color: var(--primary); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px; }
    .cp-card .cp-amount { font-size: 26px; font-weight: 700; }
    .cp-card .cp-amount .y { font-size: 14px; }
    .cp-card .cp-rate { font-size: 24px; font-weight: 700; }
    .cp-card .cp-cond { font-size: 11px; opacity: 0.9; margin-top: 4px; text-align: center; }
    .cp-card .cp-right { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; }
    .cp-card .cp-name { font-size: 14px; color: var(--text); font-weight: 600; margin-bottom: 6px; }
    .cp-card .cp-scope { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
    .cp-card .cp-time { font-size: 11px; color: var(--text-tertiary); margin-top: auto; }
    .cp-card .cp-get { margin-top: 10px; align-self: flex-start; padding: 6px 16px; background-color: var(--primary); color: #fff; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
    .cp-card.used { opacity: 0.55; }
    .cp-card.used .cp-left, .cp-card.expired .cp-left { background-color: var(--text-placeholder); }
    .cp-card.expired { opacity: 0.55; }
    .cp-card .cp-tag { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--text-tertiary); }
    .cp-empty { text-align: center; padding: 70px 0; width: 100%; color: var(--text-secondary); }
  </style>
</head>
<body>

<header class="simple-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="随心商城"></a>
    <span class="page-title">我的优惠券</span>
    <div class="header-right">
      <a href="index.html">返回首页</a>
      <span class="sep">|</span>
      <a href="orders.html">我的订单</a>
    </div>
  </div>
</header>

<div class="container cp-page">
  <div class="cp-tabs" id="jsTabs">
    <div class="cp-tab active" data-status="1">未使用</div>
    <div class="cp-tab" data-status="2">已使用</div>
    <div class="cp-tab" data-status="3">已过期</div>
    <div class="cp-get-entry" id="jsGetEntry">领券中心 ›</div>
  </div>
  <div class="cp-grid" id="jsList"></div>
  <div class="pagination" id="jsPager"></div>
</div>

<div class="footer-copyright">
  <div class="container">
    <div class="footer-logo"><img src="images/logo.png" alt="随心商城"></div>
    <div class="footer-info">
      <div class="footer-links-row">
        <a href="index.html">商城首页</a>
        <span class="sep">|</span>
        <a href="service.html">服务中心</a>
        <span class="sep">|</span>
        <a href="orders.html">我的订单</a>
        <span class="sep">|</span>
        <a href="after-sale.html">售后中心</a>
        <span class="sep">|</span>
        <a href="coupons.html">我的优惠券</a>
      </div>
      <div class="footer-record">© 2026 shop-open · 开源演示项目，非真实商户</div>
    </div>
  </div>
  <div class="footer-slogan">随心选好物，品质看得见</div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/page-coupons.js"></script>
<script src="js/live.js"></script>
</body>
</html>
