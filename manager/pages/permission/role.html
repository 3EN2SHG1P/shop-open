<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 - 商城后台管理系统</title>
  <link rel="stylesheet" href="../../css/common.css?v=20260904e">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header" id="header"></header>
      <main class="content">
        <div class="page-header">
          <div><h1 class="page-title">角色管理</h1><p class="page-desc">管理角色和权限分配，支持角色复制</p></div>
          <button class="btn btn-primary" id="btnAddRole" onclick="openCreateRole()">➕ 新增角色</button>
        </div>
        <div class="card">
          <div class="card-body no-padding">
            <div class="table-wrapper">
              <table class="table">
                <thead><tr><th>角色名称</th><th>角色标识</th><th>数据权限</th><th>管理员数</th><th>描述</th><th>状态</th><th class="col-actions">操作</th></tr></thead>
                <tbody id="roleTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="modal-overlay" id="roleModal">
    <div class="modal">
      <div class="modal-header"><h3 class="modal-title" id="roleModalTitle">新增角色</h3><button class="modal-close" data-close-modal="roleModal">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">角色名称 <span class="required">*</span></label><input type="text" class="form-control" id="r-name" placeholder="如：运营管理员"></div>
        <div class="form-group"><label class="form-label">角色标识 <span class="required">*</span></label><input type="text" class="form-control" id="r-key" placeholder="如：operator（英文唯一标识）"></div>
        <div class="form-group"><label class="form-label">数据权限范围</label><select class="form-control" id="r-scope">
          <option value="3">全部数据</option>
          <option value="2">本部门及子部门数据</option>
          <option value="1">仅本人数据</option>
        </select></div>
        <div class="form-group"><label class="form-label">角色描述</label><textarea class="form-control" id="r-desc" rows="2" placeholder="请输入角色描述"></textarea></div>
        <div class="form-group"><label class="form-label">状态</label><label class="switch"><input type="checkbox" id="r-status" checked><span class="switch-slider"></span></label></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-close-modal="roleModal">取消</button><button class="btn btn-primary" onclick="saveRole()">下一步：分配权限</button></div>
    </div>
  </div>
  <div class="modal-overlay" id="permModal">
    <div class="modal modal-lg">
      <div class="modal-header"><h3 class="modal-title" id="permModalTitle">分配权限</h3><button class="modal-close" data-close-modal="permModal">✕</button></div>
      <div class="modal-body">
        <div class="alert alert-info">勾选菜单、按钮、接口、数据四类权限，保存后立即生效。</div>
        <div style="margin-bottom:10px;display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="checkAllPerm(true)">全选</button>
          <button class="btn btn-secondary btn-sm" onclick="checkAllPerm(false)">清空</button>
        </div>
        <div style="border:1px solid var(--border-color);border-radius:var(--radius);max-height:420px;overflow-y:auto;padding:12px;" id="permTree"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-close-modal="permModal">取消</button><button class="btn btn-primary" onclick="savePerm()">保存权限</button></div>
    </div>
  </div>
  <script src="../../js/common.js?v=20260904e"></script>
  <script>
    let ROLES = [];
    let EDIT_ROLE = null;
    let TREE_NODES = [];
    const CHILDREN = {};

    function badgeCls(i) { return ['purple', 'primary', 'info', 'warning', 'default'][i % 5]; }

    function scopeBadge(v) {
      if (v === 3) return '<span class="badge-tag success">全部数据</span>';
      if (v === 2) return '<span class="badge-tag warning">本部门数据</span>';
      return '<span class="badge-tag default">本人数据</span>';
    }

    function collectChildrenMap(nodes) {
      nodes.forEach(n => {
        if (n.children && n.children.length) {
          CHILDREN[n.id] = n.children.map(c => c.id);
          collectChildrenMap(n.children);
        }
      });
    }

    function typeBadge(t) {
      if (t === 'menu') return '<span style="color:var(--text-muted);font-size:11px;margin-left:6px;">菜单</span>';
      if (t === 'button') return '<span style="font-size:11px;margin-left:6px;padding:0 6px;border-radius:4px;background:#FFF7E6;color:#D46B08;">按钮</span>';
      if (t === 'api') return '<span style="font-size:11px;margin-left:6px;padding:0 6px;border-radius:4px;background:#E6F4FF;color:#0958D9;">接口</span>';
      if (t === 'data') return '<span style="font-size:11px;margin-left:6px;padding:0 6px;border-radius:4px;background:#F0F0F0;color:#595959;">数据</span>';
      return '';
    }

    function permTreeHtml(nodes) {
      return nodes.map(n => {
        const child = n.children && n.children.length ? permTreeHtml(n.children) : '';
        const code = n.code ? `<span style="font-family:monospace;font-size:11px;color:var(--text-muted);margin-left:6px;">${AdminUI.esc(n.code)}</span>` : '';
        return `<div class="tree-node">
          <div class="tree-node-content">
            <span class="tree-toggle ${child ? 'expanded' : 'leaf'}">▶</span>
            <label class="checkbox-wrapper" style="flex:1;font-size:13px;"><input type="checkbox" class="perm-cb" data-id="${n.id}">${AdminUI.esc(n.name)}${typeBadge(n.permissionType)}${code}</label>
          </div>
          ${child ? `<div class="tree-children open" style="padding-left:24px;">${child}</div>` : ''}
        </div>`;
      }).join('');
    }

    function cbById(id) {
      return document.querySelector('#permTree .perm-cb[data-id="' + id + '"]');
    }

    async function loadRoles() {
      const data = await AdminUI.get(AdminUI.API_BASE + '/permission/roles');
      if (!data) return;
      ROLES = data;
      const rows = ROLES.map((r, idx) => {
        let act = '';
        if (AdminUI.can('permission:edit')) {
          act += `<a class="action-link" onclick="openPermAssign(${r.id})">分配权限</a>`;
          act += `<a class="action-link" onclick="openEditRole(${r.id})">编辑</a>`;
          if (r.status === 0) act += `<a class="action-link" onclick="toggleRoleStatus(${r.id},1)">启用</a>`;
        }
        if (AdminUI.can('permission:add')) act += `<a class="action-link" onclick="copyRole(${r.id})">复制</a>`;
        if (AdminUI.can('permission:delete')) act += `<a class="action-link danger" onclick="removeRole(${r.id})">删除</a>`;
        if (!act) act = '<span style="color:var(--text-muted);font-size:12px;">-</span>';
        return `<tr>
          <td style="font-weight:500;"><span class="badge-tag ${badgeCls(idx)}">${AdminUI.esc(r.roleName)}</span></td>
          <td style="font-family:monospace;font-size:12px;">${AdminUI.esc(r.roleKey)}</td>
          <td>${scopeBadge(r.dataScope)}</td>
          <td>${r.userCount || 0}</td>
          <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-secondary);" title="${AdminUI.esc(r.description || '')}">${AdminUI.esc(r.description || '-')}</td>
          <td>${r.status === 1 ? '<span class="badge-tag success">启用</span>' : '<span class="badge-tag danger">禁用</span>'}</td>
          <td class="col-actions">${act}</td>
        </tr>`;
      }).join('');
      document.getElementById('roleTbody').innerHTML = rows || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:40px 0;">暂无数据</td></tr>';
    }

    async function loadPermTree() {
      const data = await AdminUI.get(AdminUI.API_BASE + '/permission/tree');
      if (!data) return;
      TREE_NODES = data;
      collectChildrenMap(TREE_NODES);
    }

    function roleById(id) {
      for (let i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
      return null;
    }

    function resetRoleModal() {
      document.getElementById('r-name').value = '';
      document.getElementById('r-key').value = '';
      document.getElementById('r-scope').value = '3';
      document.getElementById('r-desc').value = '';
      document.getElementById('r-status').checked = true;
    }

    function fillRoleModal(r) {
      document.getElementById('r-name').value = r.roleName;
      document.getElementById('r-key').value = r.roleKey;
      document.getElementById('r-scope').value = String(r.dataScope);
      document.getElementById('r-desc').value = r.description || '';
      document.getElementById('r-status').checked = r.status === 1;
    }

    window.openCreateRole = function () {
      EDIT_ROLE = null;
      document.getElementById('roleModalTitle').textContent = '新增角色';
      resetRoleModal();
      document.querySelector('#roleModal .modal-footer .btn-primary').textContent = '下一步：分配权限';
      AdminUI.openModal('roleModal');
    };

    window.openEditRole = function (id) {
      const r = roleById(id);
      if (!r) return;
      EDIT_ROLE = Object.assign({}, r);
      document.getElementById('roleModalTitle').textContent = '编辑角色 - ' + r.roleName;
      fillRoleModal(r);
      document.querySelector('#roleModal .modal-footer .btn-primary').textContent = '保存修改';
      AdminUI.openModal('roleModal');
    };

    window.saveRole = async function () {
      const roleName = document.getElementById('r-name').value.trim();
      const roleKey = document.getElementById('r-key').value.trim();
      if (!roleName) { AdminUI.showToast('请输入角色名称', 'error'); return; }
      if (!roleKey) { AdminUI.showToast('请输入角色标识', 'error'); return; }
      const payload = {
        role_name: roleName,
        role_key: roleKey,
        description: document.getElementById('r-desc').value.trim(),
        data_scope: parseInt(document.getElementById('r-scope').value, 10),
        status: document.getElementById('r-status').checked ? 1 : 0,
        permission_ids: EDIT_ROLE ? (EDIT_ROLE.permissionIds || []) : []
      };
      try {
        if (EDIT_ROLE && EDIT_ROLE.id) {
          await AdminUI.put(AdminUI.API_BASE + '/permission/roles/' + EDIT_ROLE.id, payload);
          AdminUI.closeModal('roleModal');
          AdminUI.showToast('保存成功', 'success');
          loadRoles();
        } else {
          const d = await AdminUI.post(AdminUI.API_BASE + '/permission/roles', payload);
          EDIT_ROLE = { id: d && d.id, roleName: roleName, roleKey: roleKey, description: payload.description, dataScope: payload.data_scope, status: payload.status, permissionIds: [] };
          AdminUI.closeModal('roleModal');
          AdminUI.showToast('角色已创建，请继续分配权限', 'success');
          document.getElementById('permModalTitle').textContent = '分配权限 - ' + roleName;
          renderPermTree();
          AdminUI.openModal('permModal');
          loadRoles();
        }
      } catch (e) { }
    };

    function renderPermTree() {
      const box = document.getElementById('permTree');
      box.innerHTML = permTreeHtml(TREE_NODES) || '<div style="color:var(--text-muted);padding:20px;text-align:center;">权限资源为空</div>';
    }

    function syncParentChecks() {
      function mark(nodes) {
        nodes.forEach(n => {
          if (n.children && n.children.length) {
            mark(n.children);
            const all = n.children.every(c => {
              const el = cbById(c.id);
              return el && el.checked;
            });
            const parent = cbById(n.id);
            if (parent && all) parent.checked = true;
          }
        });
      }
      mark(TREE_NODES);
    }

    function checkAllPerm(checked) {
      document.getElementById('permTree').querySelectorAll('.perm-cb').forEach(cb => { cb.checked = checked; });
    }

    window.openPermAssign = function (id) {
      const r = roleById(id);
      if (!r) return;
      EDIT_ROLE = Object.assign({}, r);
      renderPermTree();
      const checked = new Set((r.permissionIds || []).map(String));
      document.getElementById('permTree').querySelectorAll('.perm-cb').forEach(cb => {
        cb.checked = checked.has(cb.getAttribute('data-id'));
      });
      syncParentChecks();
      document.getElementById('permModalTitle').textContent = '分配权限 - ' + r.roleName;
      AdminUI.openModal('permModal');
    };

    function cascadeChildren(id, checked) {
      (CHILDREN[id] || []).forEach(kid => {
        const el = cbById(kid);
        if (el) { el.checked = checked; cascadeChildren(kid, checked); }
      });
    }

    window.savePerm = async function () {
      if (!EDIT_ROLE || !EDIT_ROLE.id) return;
      const ids = Array.from(document.querySelectorAll('#permTree .perm-cb:checked')).map(cb => parseInt(cb.getAttribute('data-id'), 10));
      const payload = {
        role_name: EDIT_ROLE.roleName,
        role_key: EDIT_ROLE.roleKey,
        description: EDIT_ROLE.description || '',
        data_scope: EDIT_ROLE.dataScope,
        status: EDIT_ROLE.status === undefined ? 1 : EDIT_ROLE.status,
        permission_ids: ids
      };
      try {
        await AdminUI.put(AdminUI.API_BASE + '/permission/roles/' + EDIT_ROLE.id, payload);
        AdminUI.closeModal('permModal');
        AdminUI.showToast('权限保存成功', 'success');
        loadRoles();
      } catch (e) { }
    };

    window.toggleRoleStatus = async function (id, status) {
      const r = roleById(id);
      if (!r) return;
      const payload = {
        role_name: r.roleName, role_key: r.roleKey, description: r.description || '',
        data_scope: r.dataScope, status: status, permission_ids: r.permissionIds || []
      };
      try {
        await AdminUI.put(AdminUI.API_BASE + '/permission/roles/' + id, payload);
        AdminUI.showToast(status === 1 ? '已启用' : '已禁用', 'success');
        loadRoles();
      } catch (e) { }
    };

    window.copyRole = async function (id) {
      if (!window.confirm('确认复制该角色？')) return;
      try {
        await AdminUI.post(AdminUI.API_BASE + '/permission/roles/' + id + '/copy');
        AdminUI.showToast('复制成功', 'success');
        loadRoles();
      } catch (e) { }
    };

    window.removeRole = async function (id) {
      const r = roleById(id);
      if (!r) return;
      if (!window.confirm('确认删除角色「' + r.roleName + '」？')) return;
      try {
        await AdminUI.del(AdminUI.API_BASE + '/permission/roles/' + id);
        AdminUI.showToast('删除成功', 'success');
        loadRoles();
      } catch (e) { }
    };

    (async function () {
      const ok = await AdminUI.initPage({ key: 'role', breadcrumb: ['权限管理', '角色管理'], need: ['permission:list'] });
      if (!ok) return;
      if (!AdminUI.can('permission:add')) document.getElementById('btnAddRole').style.display = 'none';
      document.getElementById('permTree').addEventListener('change', function (e) {
        const cb = e.target.closest('.perm-cb');
        if (!cb) return;
        cascadeChildren(parseInt(cb.getAttribute('data-id'), 10), cb.checked);
        syncParentChecks();
      });
      await loadPermTree();
      loadRoles();
    })();
  </script>
</body>
</html>
