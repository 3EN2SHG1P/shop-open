<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品牌管理 - 商城后台管理系统</title>
  <link rel="stylesheet" href="../../css/common.css?v=20260905b">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header" id="header"></header>
      <main class="content">
        <div class="page-header">
          <div><h1 class="page-title">品牌管理</h1><p class="page-desc">管理商城品牌信息，支持批量启禁用</p></div>
          <button class="btn btn-primary" id="btnAddBrand" onclick="openBrandModal()">➕ 新增品牌</button>
        </div>
        <div class="filter-bar">
          <div class="filter-row">
            <div class="filter-item"><label>关键词</label><input type="text" id="fKeyword" class="form-control" placeholder="品牌名称"></div>
            <div class="filter-item"><label>状态</label><select id="fStatus" class="form-control"><option value="">全部</option><option value="1">启用</option><option value="0">禁用</option></select></div>
            <div class="filter-actions"><button class="btn btn-primary" onclick="resetSearch()">重置</button></div>
          </div>
        </div>
        <div class="card">
          <div class="batch-bar" id="batchBar" style="display:none;">
            <span class="batch-info">已选择 <strong class="batch-count" id="batchCount">0</strong> 项</span>
            <button class="btn btn-sm btn-success" id="btnBatchEnable" onclick="batchStatus(1)">批量启用</button>
            <button class="btn btn-sm btn-warning" id="btnBatchDisable" onclick="batchStatus(0)">批量禁用</button>
          </div>
          <div class="card-body no-padding">
            <div class="table-wrapper">
              <table class="table">
                <thead><tr><th class="col-check"><input type="checkbox" class="check-all"></th><th>品牌Logo</th><th>品牌名称</th><th>品牌简介</th><th>关联商品数</th><th>排序</th><th>状态</th><th class="col-actions">操作</th></tr></thead>
                <tbody id="brandBody"></tbody>
              </table>
            </div>
            <div class="pagination" id="brandPagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="modal-overlay" id="brandModal">
    <div class="modal">
      <div class="modal-header"><h3 class="modal-title" id="brandModalTitle">新增品牌</h3><button class="modal-close" data-close-modal="brandModal">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">品牌名称 <span class="required">*</span></label><input type="text" id="fName" class="form-control" placeholder="请输入品牌名称"></div>
        <div class="form-group">
          <label class="form-label">品牌Logo</label>
          <div class="img-field">
            <div class="img-thumb" id="logoPreview">🏷</div>
            <input type="text" id="fLogo" class="form-control" placeholder="可粘贴 http(s) 图片外链，或点击「上传」选择本地图片">
            <button type="button" class="btn btn-sm btn-secondary upload-trigger" id="btnLogoUpload">上传</button>
          </div>
        </div>
        <div class="form-group"><label class="form-label">品牌简介</label><textarea id="fDesc" class="form-control" placeholder="请输入品牌简介"></textarea></div>
        <div class="form-group"><label class="form-label">排序</label><input type="number" id="fSort" class="form-control" value="0"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary" data-close-modal="brandModal">取消</button><button class="btn btn-primary" onclick="saveBrand()">确认保存</button></div>
    </div>
  </div>
  <script src="../../js/common.js?v=20260905b"></script>
  <script>
    const API = AdminUI.API_BASE;
    let PAGE = 1, SIZE = 10;
    const F = { keyword: '', status: '' };
    let EDIT_ID = null;

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function logoHtml(logo) {
      if (AdminUI.isImgSrc(logo)) return AdminUI.imgSrcHtml(logo, 'logo');
      return '🏷';
    }

    async function loadBrands(page) {
      PAGE = page || PAGE;
      const data = await AdminUI.get(API + '/brands', {
        page: PAGE, page_size: SIZE,
        keyword: F.keyword || undefined,
        status: F.status === '' ? undefined : F.status
      });
      if (!data) return;
      renderRows((data.list || []), data.total || 0);
    }

    let _lastRows = [];

    function renderRows(list, total) {
      _lastRows = list || [];
      const canEdit = AdminUI.can('goods:edit');
      const canDel = AdminUI.can('goods:delete');
      const tbody = document.getElementById('brandBody');
      const rows = list.map(function (b) {
        let acts = '';
        if (canEdit) acts += '<a class="action-link" onclick="openBrandModal(' + b.id + ')">编辑</a>';
        if (canEdit) {
          acts += b.status === 1
            ? '<a class="action-link warning" onclick="toggleStatus(' + b.id + ',0)">禁用</a>'
            : '<a class="action-link" onclick="toggleStatus(' + b.id + ',1)">启用</a>';
        }
        if (canDel) acts += '<a class="action-link danger" onclick="delBrand(' + b.id + ')">删除</a>';
        return '<tr>' +
          '<td class="col-check"><input type="checkbox" class="row-check" value="' + b.id + '"></td>' +
          '<td><div class="img-thumb">' + logoHtml(b.logo) + '</div></td>' +
          '<td style="font-weight:500;">' + esc(b.name) + '</td>' +
          '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(b.description || '-') + '</td>' +
          '<td>' + (Number(b.goodsCount) || 0) + '</td>' +
          '<td>' + (b.sort === null || b.sort === undefined ? 0 : b.sort) + '</td>' +
          '<td>' + (b.status ? '<span class="badge-tag success">启用</span>' : '<span class="badge-tag default">禁用</span>') + '</td>' +
          '<td class="col-actions">' + acts + '</td>' +
          '</tr>';
      }).join('');
      tbody.innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:40px 0;">暂无数据</td></tr>';
      AdminUI.initCheckAll();
      syncBatch();
      const totalPages = Math.max(1, Math.ceil(total / SIZE));
      AdminUI.renderPagination('brandPagination', PAGE, totalPages, total, SIZE);
    }

    function syncBatch() {
      const n = document.querySelectorAll('#brandBody .row-check:checked').length;
      document.getElementById('batchCount').textContent = n;
      document.getElementById('batchBar').style.display = n ? 'flex' : 'none';
    }

    function doSearch() {
      F.keyword = document.getElementById('fKeyword').value.trim();
      F.status = document.getElementById('fStatus').value;
      loadBrands(1);
    }

    function resetSearch() {
      document.getElementById('fKeyword').value = '';
      document.getElementById('fStatus').value = '';
      F.keyword = ''; F.status = '';
      loadBrands(1);
    }

    function selectedIds() {
      return Array.prototype.map.call(document.querySelectorAll('#brandBody .row-check:checked'), function (c) { return Number(c.value); });
    }

    async function batchStatus(status) {
      const ids = selectedIds();
      if (!ids.length) { AdminUI.showToast('请先选择品牌', 'warning'); return; }
      try {
        for (let i = 0; i < ids.length; i++) await AdminUI.put(API + '/brands/' + ids[i] + '/status?status=' + status);
        AdminUI.showToast(status === 1 ? '批量启用成功' : '批量禁用成功', 'success');
        loadBrands(PAGE);
      } catch (e) { }
    }

    async function toggleStatus(id, status) {
      try {
        await AdminUI.put(API + '/brands/' + id + '/status?status=' + status);
        AdminUI.showToast(status === 1 ? '已启用' : '已禁用', 'success');
        loadBrands(PAGE);
      } catch (e) { }
    }

    async function delBrand(id) {
      if (!window.confirm('确认删除该品牌？')) return;
      try {
        await AdminUI.del(API + '/brands/' + id);
        AdminUI.showToast('删除成功', 'success');
        loadBrands(1);
      } catch (e) { }
    }

    function renderLogoPreview() {
      const url = document.getElementById('fLogo').value.trim();
      const box = document.getElementById('logoPreview');
      box.innerHTML = AdminUI.isImgSrc(url) ? AdminUI.imgSrcHtml(url, 'logo') : '🏷';
    }

    function resetBrandForm() {
      EDIT_ID = null;
      document.getElementById('brandModalTitle').textContent = '新增品牌';
      document.getElementById('fName').value = '';
      document.getElementById('fLogo').value = '';
      document.getElementById('fDesc').value = '';
      document.getElementById('fSort').value = '0';
      renderLogoPreview();
    }

    function openBrandModal(id) {
      const row = (_lastRows || []).find(function (b) { return b.id === id; });
      if (row) {
        EDIT_ID = row.id;
        document.getElementById('brandModalTitle').textContent = '编辑品牌 - ' + row.name;
        document.getElementById('fName').value = row.name || '';
        document.getElementById('fLogo').value = row.logo || '';
        document.getElementById('fDesc').value = row.description || '';
        document.getElementById('fSort').value = row.sort === null || row.sort === undefined ? 0 : row.sort;
      } else {
        resetBrandForm();
      }
      renderLogoPreview();
      AdminUI.openModal('brandModal');
    }

    async function saveBrand() {
      const name = document.getElementById('fName').value.trim();
      if (!name) { AdminUI.showToast('请填写品牌名称', 'warning'); return; }
      const payload = {
        name: name,
        logo: document.getElementById('fLogo').value.trim(),
        description: document.getElementById('fDesc').value.trim(),
        sort: Number(document.getElementById('fSort').value) || 0
      };
      try {
        if (EDIT_ID) {
          await AdminUI.put(API + '/brands/' + EDIT_ID, payload);
        } else {
          await AdminUI.post(API + '/brands', payload);
        }
        AdminUI.showToast('保存成功', 'success');
        AdminUI.closeModal('brandModal');
        loadBrands(1);
      } catch (e) { }
    }

    (async function () {
      const ok = await AdminUI.initPage({ key: 'goods-brand', breadcrumb: ['商品管理', '品牌管理'], need: ['goods:list'] });
      if (!ok) return;
      if (!AdminUI.can('goods:add')) document.getElementById('btnAddBrand').style.display = 'none';
      if (!AdminUI.can('goods:edit')) { document.getElementById('btnBatchEnable').style.display = 'none'; document.getElementById('btnBatchDisable').style.display = 'none'; }
      document.getElementById('brandBody').addEventListener('change', syncBatch);
      // 实时筛选绑定
      document.getElementById('fKeyword').addEventListener('input', AdminUI.debounce(function () { doSearch(); }, 350));
      document.getElementById('fStatus').addEventListener('change', function () { doSearch(); });
      const pg = document.getElementById('brandPagination');
      pg.addEventListener('click', function (e) {
        const b = e.target.closest('button[data-page]');
        if (!b || b.disabled) return;
        loadBrands(Number(b.getAttribute('data-page')));
      });
      pg.addEventListener('change', function (e) {
        if (e.target.classList.contains('page-size-select')) {
          SIZE = Number(e.target.value);
          loadBrands(1);
        }
      });
      AdminUI.enableImageUpload({
        input: document.getElementById('fLogo'),
        btn: document.getElementById('btnLogoUpload'),
        onUpload: function () { renderLogoPreview(); }
      });
      await loadBrands(1);
    })();
  </script>
</body>
</html>
