# 一键起 MySQL 8，供本机开发/新手跑通本项目（无需手工安装 MySQL）。
#
# 用法：在项目根目录执行   docker compose up -d
# 停止：docker compose down        清空数据重来：docker compose down -v
#
# ⚠️ 安全须知（请务必读完这 8 行）
#   1. 本文件定位是「本机开发」，仅供 127.0.0.1 访问：3306 只映射到回环地址，
#      局域网/公网机器无法连接，请勿改成 0.0.0.0:3306 后部署到服务器上。
#   2. 默认口令 DEV_ONLY_123456 只是为了让新手零配置跑通第一次，
#      任何非本机环境都必须替换。替换方式二选一（任选其一即可）：
#        A. 命令行：DB_PASSWORD=你的强口令 docker compose up -d
#        B. 持久化写法：在本目录建 .env.db，再用
#           docker compose --env-file .env.db up -d
#      说明：Docker Compose 只自动加载项目根目录的 .env，不会自动读 .env.db，
#      所以必须显式加 --env-file，否则容器仍用默认口令 DEV_ONLY_123456。
#   3. .env.db 已被 .gitignore 忽略，不会进入仓库。
#
# 其余 DB_*（127.0.0.1 / 3306 / root / aaashop）与 backend/.env.example 默认值一致，无需修改。

services:
  mysql:
    image: mysql:8.0
    # Apple Silicon（M1/M2/M3）如容器起不来，取消下面这行的注释
    # platform: linux/amd64
    container_name: shop-open-mysql
    restart: unless-stopped
    ports:
      # 只绑定回环地址：避免数据库被局域网或公网的其它机器访问
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-DEV_ONLY_123456}
      # MySQL 容器内所有 Alternate Root 主机允许连接——配合上面的回环映射，
      # 实际只有本机进程（含 Docker 网关地址）能连上
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: aaashop
      TZ: Asia/Shanghai
    command:
      # 字符集与排序规则须与 seed 建库语句一致，否则会有 Illegal mix of collations
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # MySQL 8 默认 caching_sha2_password，部分客户端握手失败，降级为兼容模式
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=+08:00
    volumes:
      - shop-open-mysql-data:/var/lib/mysql
    healthcheck:
      # 用 CMD-SHELL + $$VAR：口令由容器自身环境变量展开，compose 文件里不再出现明文，
      # 也不会出现在 docker inspect 的静态配置中。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  shop-open-mysql-data:
