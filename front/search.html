<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品搜索 - 随心商城</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-main { padding: 0 0 40px; }
    .search-layout { display: flex; gap: 16px; align-items: flex-start; }
    .filter-sidebar { width: 210px; flex-shrink: 0; background-color: var(--bg-white); padding: 16px 14px; }
    .filter-group { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border-light); }
    .filter-group:last-child { border-bottom: none; margin-bottom: 0; }
    .filter-group h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .filter-group .filter-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-secondary); line-height: 26px;
      cursor: pointer; text-decoration: none;
    }
    .filter-group .filter-item:hover { color: var(--primary); }
    .filter-group .filter-item.active { color: var(--primary); font-weight: 700; }
    .filter-group .filter-item .cnt { color: var(--text-tertiary); font-size: 11px; }
    .filter-group .price-custom { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .filter-group .price-custom input {
      width: 58px; height: 26px; border: 1px solid var(--border); border-radius: 2px;
      padding: 0 6px; font-size: 12px; outline: none;
    }
    .filter-group .price-custom input:focus { border-color: var(--primary); }
    .filter-group .price-custom .go {
      height: 26px; padding: 0 10px; background-color: var(--primary); color: #fff;
      font-size: 12px; border: none; border-radius: 2px; cursor: pointer;
    }
    .search-content { flex: 1; min-width: 0; }
    .sort-bar { background-color: var(--bg-white); padding: 0 16px; display: flex; align-items: center; height: 44px; margin-bottom: 12px; }
    .sort-bar .sort-label { font-size: 12px; color: var(--text-secondary); margin-right: 14px; flex: none; }
    .sort-bar .sort-options { display: flex; gap: 18px; overflow: hidden; }
    .sort-bar .sort-option { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 4px 0; white-space: nowrap; }
    .sort-bar .sort-option.active { color: var(--primary); font-weight: 700; }
    .sort-bar .result-count { margin-left: auto; font-size: 12px; color: var(--text-tertiary); flex: none; }
    .search-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .search-item { background-color: var(--bg-white); padding: 16px 12px; cursor: pointer; transition: all 0.3s; text-align: center; text-decoration: none; display: block; }
    .search-item:hover { box-shadow: 0 4px 16px var(--shadow); transform: translateY(-2px); }
    .search-item .item-img { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; }
    .search-item .item-img img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .search-item .item-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .search-item .item-desc { font-size: 11px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
    .search-item .item-price { font-size: 16px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
    .search-item .item-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-tertiary); }
    .search-item .item-meta .shop { color: var(--text-secondary); }
    .pagination { justify-content: center; }
    /* 前台分类菜单（参考后台 .sidebar-menu / .menu-item 风格：白底容器+每项独立小卡，hover 浅米，active 渐变橙带阴影） */
    .cat-menu { background:#FFFFFF; border:1px solid var(--border-light); border-radius:8px; padding:6px 0; }
    .cat-menu-row { height:36px; line-height:36px; margin:2px 8px; padding:0 10px 0 14px; border-radius:8px; color:var(--text); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; transition:background-color .2s var(--ease-smooth),color .2s var(--ease-smooth),box-shadow .2s var(--ease-smooth); }
    .cat-menu-row:hover { background:#EFF9F8; color:var(--primary); }
    .cat-menu-row.active { color:#FFFFFF; background-image:linear-gradient(135deg,var(--primary-active) 0%,var(--primary-deep) 100%); font-weight:500; }
    .cat-menu-row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:inherit; }

    /* 二级分类横排（子分类细选唯一入口：hover 浅米、选中=透明底+阴影浮起） */
    .subcat-bar { display:flex; flex-wrap:wrap; gap:8px; background-color:var(--bg-white); border:1px solid var(--border-light); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
    .subcat { height:32px; line-height:32px; padding:0 14px; border-radius:8px; font-size:13px; color:var(--text); cursor:pointer; transition:background-color .2s var(--ease-smooth),color .2s var(--ease-smooth),box-shadow .2s var(--ease-smooth); }
    .subcat:hover:not(.active) { background-color:#EFF9F8; color:var(--primary); }
    .subcat.active { background-color:transparent; color:var(--primary); font-weight:600; box-shadow:0 2px 4px rgba(30,158,150,.22), 0 4px 12px rgba(0,0,0,.10); }

    /* 筛选侧栏 & 卡片统一圆角（参考后台卡片观感） */
    .filter-sidebar { border-radius: var(--radius); border: 1px solid var(--border-light); }
    .filter-group { margin-bottom: 16px; padding: 14px 14px; border-radius: var(--radius); background: var(--bg-white); }
    .filter-group + .filter-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }
    .filter-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 14px; }
    .sort-bar { background-color: var(--bg-white); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 0 16px; display: flex; align-items: center; height: 44px; margin-bottom: 12px; }
    .search-item { background-color: var(--bg-white); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px 12px; cursor: pointer; transition: all 0.3s var(--ease-smooth); text-align: center; text-decoration: none; display: block; }
    .search-item:hover { box-shadow: 0 6px 20px rgba(0,0,0,.08); transform: translateY(-2px); border-color: transparent; }
    .pagination { justify-content: center; }
  </style>
</head>
<body>

<!-- 顶部黑色通栏 -->

        购物车(<span class="cart-count">0</span>)

</div>

<!-- 主导航栏 -->
<header class="main-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="随心商城"></a>
    <nav class="main-nav">
      <a href="search.html">手机</a>
      <a href="search.html">智能手机</a>
      <a href="search.html">电视</a>
      <a href="search.html">笔记本</a>
      <a href="search.html">平板</a>
      <a href="search.html">家电</a>
      <a href="search.html">路由器</a>
      <a href="service.html">服务中心</a>
    </nav>
    <div class="search-box">
      <input type="text" class="search-input" placeholder="搜索商品" id="jsKeywordInput">
      <button class="search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="container search-main">
  <!-- 面包屑 -->
  <div class="breadcrumb">
    <a href="index.html">首页</a><span class="sep">/</span>
    <a href="search.html" id="jsCrumbAll">全部商品</a><span class="sep" id="jsCrumbAllSep">/</span>
    <span class="current" id="jsCrumb">全部商品</span>
  </div>

  <div class="search-layout">
    <!-- 左侧筛选栏 -->
    <aside class="filter-sidebar">
      <div class="filter-group">
        <h4>商品分类</h4>
        <div id="jsCatBox"><div class="filter-item">加载中…</div></div>
      </div>
      <div class="filter-group">
        <h4>价格区间</h4>
        <div class="price-custom">
          <input type="number" id="jsMin" placeholder="最低价"><span>-</span>
          <input type="number" id="jsMax" placeholder="最高价">
          <button class="go" id="jsPriceGo">确定</button>
        </div>
        <div id="jsPriceBox"></div>
      </div>
      <div class="filter-group">
        <h4>品牌</h4>
        <div id="jsBrandBox"></div>
      </div>
      <div class="filter-group">
        <h4>筛选条件</h4>
        <div id="jsTagBox"></div>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <div class="search-content">
      <!-- 二级分类横排（产品线入口页展示直属子分类细选） -->
      <div class="subcat-bar" id="jsSubCatBar" style="display:none;"></div>
      <div class="sort-bar">
        <span class="sort-label">排序：</span>
        <div class="sort-options" id="jsSortBar"></div>
        <span class="result-count" id="jsCount"></span>
      </div>
      <div class="search-grid" id="jsGrid"></div>
      <div class="pagination" id="jsPager" style="display:none;"></div>
    </div>
  </div>
</div>

</div>
