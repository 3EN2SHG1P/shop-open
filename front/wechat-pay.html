<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码支付（模拟演示） - 随心商城</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }
    .payment-page { padding: 30px 0 40px; min-height: 500px; }
    .payment-card { background-color: var(--bg-white); border-radius: 4px; padding: 32px; max-width: 700px; margin: 0 auto; }
    .payment-header { text-align: center; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light); }
    .payment-header .order-no { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .payment-header .order-no span { color: var(--text); font-weight: 500; }
    .payment-header .pay-amount { font-size: 14px; color: var(--text-secondary); }
    .payment-header .pay-amount .amount { font-size: 32px; color: var(--primary); font-weight: 700; }
    .payment-header .pay-amount .amount .yuan { font-size: 16px; }
    .payment-header .countdown { font-size: 12px; color: var(--text-tertiary); margin-top: 8px; }
    .payment-method-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .pay-method { display: flex; align-items: center; padding: 16px 20px; border: 1px solid var(--border); border-radius: 4px; }
    .pay-method.active { border-color: var(--primary); background-color: var(--primary-light); }
    .pay-method .pm-radio { width: 16px; height: 16px; border: 2px solid var(--primary); border-radius: 50%; margin-right: 14px; display: flex; align-items: center; justify-content: center; }
    .pay-method .pm-radio::after { content: ""; width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; }
    .pay-method .pm-icon { width: 32px; height: 32px; border-radius: 6px; background-color: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; margin-right: 14px; }
    .pay-method .pm-info .pm-name { font-size: 14px; color: var(--text); font-weight: 500; }
    .pay-method .pm-info .pm-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .payment-footer { text-align: center; }
    .pay-btn { width: 240px; height: 46px; background-color: var(--primary); color: #fff; font-size: 16px; font-weight: 500; border-radius: 4px; cursor: pointer; border: none; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 95; display: block; }
    .wechat-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 360px; background-color: var(--bg-white); border-radius: 8px; z-index: 100; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
    .wechat-modal .modal-header { height: 44px; background-color: var(--primary); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .wechat-modal .modal-header .modal-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
    .wechat-modal .modal-header .modal-close { font-size: 18px; color: rgba(255,255,255,0.8); cursor: pointer; }
    .wechat-modal .modal-body { padding: 28px 24px; text-align: center; }
    .qr-code { width: 200px; height: 200px; margin: 0 auto 16px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; background-color: var(--bg); position: relative; }
    .qr-code svg { width: 180px; height: 180px; }
    .qr-amount { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .qr-amount .yuan { font-size: 14px; }
    .qr-tip { font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; }
    .qr-mock-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background-color: rgba(0,0,0,0.75); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 2px; padding: 6px 14px; border-radius: 4px; }
    .pay-success-btn { width: 100%; height: 40px; background-color: var(--primary); color: #fff; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; border: none; }
    .pay-success-btn:hover { background-color: var(--primary-deep); }
    .modal-footer-tip { font-size: 11px; color: var(--text-tertiary); margin-top: 12px; text-align: center; }
  </style>
</head>
<body>

<header class="simple-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="随心商城"></a>
    <span class="page-title">订单支付</span>
    <div class="header-right"><a href="orders.html">我的订单</a><span class="sep">|</span><a href="index.html">返回首页</a></div>
  </div>
</header>

<div class="container payment-page">
  <div class="payment-card">
    <div class="payment-header">
      <div class="order-no">订单号：<span id="jsOrderNo">—</span></div>
      <div class="pay-amount">应付金额：<span class="amount"><span class="yuan">¥</span><span id="jsPayAmount">0.00</span></span></div>
      <div class="countdown">请在 <span class="payment-countdown" id="jsCountdown">--</span> 内完成支付</div>
    </div>
    <div class="payment-method-list">
      <div class="pay-method active">
        <div class="pm-radio"></div>
        <div class="pm-icon">扫</div>
        <div class="pm-info"><div class="pm-name">扫码支付</div><div class="pm-desc">演示环境模拟支付，不产生真实交易</div></div>
      </div>
    </div>
    <div class="payment-footer">
      <button class="pay-btn" id="jsBackBtn">返回重选支付方式</button>
    </div>
  </div>
</div>

<div class="modal-overlay"></div>

<!-- 扫码支付弹窗（模拟演示，不接真实支付网关） -->
<div class="wechat-modal">
  <div class="modal-header">
    <span class="modal-title">🧾 扫码支付（模拟演示）</span>
    <span class="modal-close" id="jsBackBtn2">×</span>
  </div>
  <div class="modal-body">
    <div class="qr-code">
      <!-- 模拟二维码：仅用于演示收银台外观，不是可扫描的收款码 -->
      <span class="qr-mock-badge">演示专用</span>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#fff"/>
        <g fill="#000">
          <rect x="5" y="5" width="25" height="25"/><rect x="10" y="10" width="15" height="15" fill="#fff"/><rect x="13" y="13" width="9" height="9"/>
          <rect x="70" y="5" width="25" height="25"/><rect x="75" y="10" width="15" height="15" fill="#fff"/><rect x="78" y="13" width="9" height="9"/>
          <rect x="5" y="70" width="25" height="25"/><rect x="10" y="75" width="15" height="15" fill="#fff"/><rect x="13" y="78" width="9" height="9"/>
          <rect x="40" y="5" width="5" height="5"/><rect x="50" y="5" width="5" height="5"/><rect x="60" y="10" width="5" height="5"/>
          <rect x="35" y="15" width="5" height="5"/><rect x="45" y="20" width="5" height="5"/><rect x="55" y="15" width="5" height="5"/>
          <rect x="40" y="35" width="5" height="5"/><rect x="50" y="40" width="5" height="5"/><rect x="60" y="35" width="5" height="5"/><rect x="70" y="40" width="5" height="5"/><rect x="80" y="35" width="5" height="5"/>
          <rect x="35" y="45" width="5" height="5"/><rect x="45" y="50" width="5" height="5"/><rect x="55" y="45" width="5" height="5"/><rect x="65" y="50" width="5" height="5"/><rect x="75" y="45" width="5" height="5"/><rect x="85" y="50" width="5" height="5"/>
          <rect x="40" y="55" width="5" height="5"/><rect x="50" y="60" width="5" height="5"/><rect x="60" y="55" width="5" height="5"/><rect x="70" y="60" width="5" height="5"/><rect x="80" y="55" width="5" height="5"/>
          <rect x="35" y="70" width="5" height="5"/><rect x="45" y="75" width="5" height="5"/><rect x="55" y="70" width="5" height="5"/><rect x="65" y="75" width="5" height="5"/><rect x="75" y="70" width="5" height="5"/><rect x="85" y="75" width="5" height="5"/>
          <rect x="40" y="85" width="5" height="5"/><rect x="50" y="90" width="5" height="5"/><rect x="60" y="85" width="5" height="5"/><rect x="70" y="90" width="5" height="5"/>
        </g>
      </svg>
    </div>
    <div class="qr-amount"><span class="yuan">¥</span><span id="jsModalAmount">0.00</span></div>
    <div class="qr-tip">演示环境模拟扫码，不会产生真实交易</div>
    <button class="pay-success-btn" id="jsPaySuccessBtn">我已完成支付</button>
    <div class="modal-footer-tip">支付遇到问题？请联系客服 400-000-0000（示例号码）</div>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/page-wechat-pay.js"></script>
<script src="js/live.js"></script>
</body>
</html>
