<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>去结算 - 随心商城</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-page { padding: 20px 0 100px; }
    .checkout-section { background-color: var(--bg-white); margin-bottom: 12px; border-radius: 4px; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; }
    .section-header h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .section-header .section-tip { font-size: 11px; color: var(--text-tertiary); margin-left: 12px; }
    .section-header .header-action { margin-left: auto; font-size: 12px; color: var(--primary); cursor: pointer; }
    .section-body { padding: 20px; }
    .loading-hint { padding: 30px 0; text-align: center; font-size: 13px; color: var(--text-secondary); }
    .empty-hint { padding: 20px 0; text-align: center; font-size: 13px; color: var(--text-secondary); }
    /* 地址 */
    .address-card { border: 1px solid var(--primary); background-color: var(--primary-light); border-radius: 4px; padding: 16px 20px; position: relative; }
    .address-card .addr-top { display: flex; align-items: center; margin-bottom: 8px; }
    .address-card .addr-name { font-size: 14px; font-weight: 700; color: var(--text); margin-right: 16px; }
    .address-card .addr-phone { font-size: 13px; color: var(--text-secondary); }
    .address-card .addr-default { display: inline-block; padding: 2px 6px; background-color: var(--primary); color: #fff; font-size: 10px; border-radius: 2px; margin-left: 12px; }
    .address-card .addr-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.5; padding-right: 160px; }
    .address-card .addr-actions { position: absolute; right: 20px; top: 16px; display: flex; gap: 12px; }
    .address-card .addr-actions a { font-size: 12px; color: var(--text-secondary); }
    .address-card .addr-actions a:hover { color: var(--primary); }
    .address-empty { text-align: center; padding: 30px 0; }
    .address-empty .empty-icon { font-size: 40px; color: var(--text-placeholder); margin-bottom: 12px; }
    .address-empty .empty-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
    .add-address-btn { display: inline-block; padding: 8px 24px; background-color: var(--primary); color: #fff; font-size: 13px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .add-address-btn:hover { background-color: var(--primary-hover); color: #fff; }
    /* 商品清单 */
    .checkout-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .checkout-item:last-child { border-bottom: none; }
    .checkout-item img { width: 60px; height: 60px; object-fit: contain; margin-right: 16px; background-color: var(--bg); border-radius: 4px; }
    .checkout-item .item-info { flex: 1; }
    .checkout-item .item-name { font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .checkout-item .item-spec { font-size: 11px; color: var(--text-tertiary); }
    .seckill-tag { display: inline-block; margin-top: 4px; padding: 0 6px; border-radius: 2px; background: var(--danger); color: #fff; }
    .checkout-item .item-price { font-size: 14px; color: var(--text); width: 100px; text-align: right; }
    .checkout-item .item-qty { font-size: 13px; color: var(--text-secondary); width: 60px; text-align: center; }
    .checkout-item .item-subtotal { font-size: 14px; color: var(--primary); font-weight: 700; width: 100px; text-align: right; }
    /* 优惠 */
    .benefit-row { display: flex; align-items: center; font-size: 13px; color: var(--text-secondary); padding: 8px 0; }
    .benefit-row:first-child { padding-top: 0; }
    .benefit-row .benefit-label { width: 90px; color: var(--text-secondary); }
    .benefit-row select { flex: 1; max-width: 420px; height: 34px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; color: var(--text); }
    .benefit-row .benefit-tip { margin-left: 12px; font-size: 12px; color: var(--text-tertiary); }
    .benefit-row label input { margin-right: 6px; }
    /* 支付方式 */
    .payment-methods { display: flex; gap: 16px; }
    .payment-method { display: flex; align-items: center; padding: 12px 20px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: all 0.2s; min-width: 160px; }
    .payment-method:hover { border-color: var(--primary); }
    .payment-method.active { border-color: var(--primary); background-color: var(--primary-light); }
    .payment-method .pm-icon { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; margin-right: 10px; }
    .pm-scan { background-color: var(--primary); }
    .pm-quick { background-color: var(--info); }
    .payment-method .pm-name { font-size: 13px; color: var(--text); }
    /* 订单备注 */
    .remark-input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
    .remark-input:focus { border-color: var(--primary); }
    /* 金额明细 */
    .amount-list { font-size: 13px; color: var(--text-secondary); }
    .amount-list .amount-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .amount-list .amount-row .val { color: var(--text); }
    .amount-list .amount-row.discount .val { color: var(--primary); }
    /* 底部结算栏 */
    .checkout-footer { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--bg-white); border-top: 1px solid var(--border); padding: 16px 0; z-index: 90; }
    .checkout-footer .container { display: flex; align-items: center; justify-content: flex-end; }
    .footer-info { display: flex; align-items: center; gap: 24px; margin-right: 24px; }
    .footer-info .info-item { font-size: 13px; color: var(--text-secondary); }
    .footer-info .info-item span { color: var(--text); font-weight: 500; }
    .footer-total { display: flex; align-items: baseline; gap: 4px; margin-right: 24px; }
    .footer-total .total-label { font-size: 13px; color: var(--text-secondary); }
    .footer-total .total-amount { font-size: 26px; color: var(--primary); font-weight: 700; }
    .footer-total .total-amount .yuan { font-size: 14px; }
    .submit-order-btn { width: 160px; height: 44px; background-color: var(--primary); color: #fff; font-size: 15px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .submit-order-btn:hover { background-color: var(--primary-hover); box-shadow: 0 4px 12px rgba(30,158,150,0.3); }
    .submit-order-btn[disabled] { opacity: .6; cursor: not-allowed; box-shadow: none; }
  </style>
</head>
<body>

<!-- 简化版导航栏 -->
<header class="simple-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="随心商城"></a>
    <span class="page-title">确认订单</span>
    <div class="header-right">
      <a href="cart.html">返回购物车</a>
    </div>
  </div>
</header>

<div class="container checkout-page">
  <!-- 收货地址 -->
  <div class="checkout-section">
    <div class="section-header">
      <h3>收货地址</h3>
      <span class="section-tip">收货地址变化时本项目以服务端算运费为准</span>
    </div>
    <div class="section-body" id="jsAddress"></div>
  </div>

  <!-- 商品清单 -->
  <div class="checkout-section">
    <div class="section-header"><h3>商品清单</h3></div>
    <div class="section-body" style="padding:0 20px;" id="jsItems"></div>
  </div>

  <!-- 优惠券 / 积分 -->
  <div class="checkout-section">
    <div class="section-header"><h3>优惠</h3></div>
    <div class="section-body">
      <div class="benefit-row">
        <span class="benefit-label">优惠券</span>
        <select id="jsCoupon"></select>
        <span class="benefit-tip" id="jsCouponInfo"></span>
      </div>
      <div class="benefit-row" id="jsPoints">
        <span class="benefit-label">积分抵扣</span>
        <label><input type="checkbox" id="jsPointsUse"><span id="jsPointsText"></span></label>
      </div>
    </div>
  </div>

  <!-- 支付方式 -->
  <div class="checkout-section">
    <div class="section-header"><h3>支付方式</h3></div>
    <div class="section-body">
      <div class="payment-methods">
        <div class="payment-method active" data-pay="1">
          <div class="pm-icon pm-scan">扫</div><span class="pm-name">扫码支付</span>
        </div>
        <div class="payment-method" data-pay="2">
          <div class="pm-icon pm-quick">快</div><span class="pm-name">快捷支付</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 订单备注 -->
  <div class="checkout-section">
    <div class="section-header"><h3>订单备注</h3></div>
    <div class="section-body">
      <input type="text" class="remark-input" id="jsRemark" placeholder="选填，请先和商家协商一致" maxlength="200">
    </div>
  </div>

  <!-- 金额明细 -->
  <div class="checkout-section">
    <div class="section-header"><h3>金额明细</h3></div>
    <div class="section-body">
      <div class="amount-list">
        <div class="amount-row"><span>商品总额</span><span class="val" id="jsTotal">¥0</span></div>
        <div class="amount-row"><span>运费</span><span class="val" id="jsFreight">¥0</span></div>
        <div class="amount-row discount" id="jsRowCoupon" style="display:none"><span>优惠券抵扣</span><span class="val" id="jsCouponAmount">¥0</span></div>
        <div class="amount-row discount" id="jsRowPoints" style="display:none"><span>积分抵扣</span><span class="val" id="jsPointsAmount">¥0</span></div>
      </div>
    </div>
  </div>
</div>

<!-- 底部结算栏 -->
<div class="checkout-footer">
  <div class="container">
    <div class="footer-info">
      <div class="info-item">共 <span id="jsCount">0</span> 件商品</div>
      <div class="info-item">应付总额</div>
    </div>
    <div class="footer-total">
      <span class="total-label">¥</span>
      <span class="total-amount" id="jsPay">0</span>
    </div>
    <button class="submit-order-btn" id="jsSubmit" disabled>提交订单</button>
  </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/page-checkout.js"></script>
<script src="js/live.js"></script>
</body>
</html>
